# CCI-ready expanded experiment configuration. This task does not launch it.
mode: CRS_EXPANDED_POINTERCAD
model:
  base_model: "Qwen/Qwen2.5-0.5B-Instruct"
  dtype: bf16
  use_lora: true
  lora_rank: 8
  lora_alpha: 32
  lora_dropout: 0.1
  hidden_dim: 896
  pointer_dim: 128
  grammar_vocab_size: 1024
  use_body_relative_age: true
  body_pooling: mean
  registry_context_mode: TYPE_POOLED
  enable_historical_face: true
  enable_historical_edge: true
  pointer_feedback: true
  typed_pointer_scales: true
  numeric_heads: true
  ragged_pointer_batching: true
  autoregressive_pointer_feedback: true
train:
  batch_size: 2
  gradient_accumulation_steps: 8
  lr: 1.0e-4
  lambda_grammar: 1.0
  lambda_pointer: 1.0
  lambda_scalar: 1.0
  lambda_record: 1.0
runtime:
  known_executor_tail_policy: record_and_continue
